[build]
  # The directory where the frontend code is located
  base = "frontend"
  
  # The command to build the project
  command = "npm run build"
  
  # The directory that Netlify will serve (relative to the base directory)
  # For Next.js, this is usually .next or out (if using static export)
  publish = ".next"

[[plugins]]
  # This plugin handles Next.js specific optimizations on Netlify
  package = "@netlify/plugin-nextjs"

[[redirects]]
  # Standard SPA redirects for client-side routing
  from = "/*"
  to = "/index.html"
  status = 200
SECRETS_SCAN_ENABLED="false"
